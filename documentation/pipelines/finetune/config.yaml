dataset:
  source_dir: ../../docs
  output_file: ./data/train.jsonl
  min_chars_per_chunk: 400
  max_chars_per_chunk: 1800

training:
  base_model: Qwen/Qwen2.5-7B-Instruct
  output_dir: ./output/qwen2.5-7b-lora
  max_seq_length: 2048
  learning_rate: 2.0e-4
  num_train_epochs: 2
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 8
  logging_steps: 10
  save_steps: 100

lora:
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
