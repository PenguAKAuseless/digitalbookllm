version: '3.8'

# Local development stack: PostgreSQL+pgvector and the API+worker container.
# Production uses managed Supabase Postgres instead of the `postgres` service
# below — see docs/deployment.md.
services:
  postgres:
    image: ankane/pgvector:latest
    container_name: digitalbookllm-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password}
      POSTGRES_DB: ${DB_NAME:-digitalbookllm}
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./src/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - digitalbookllm-network

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: digitalbookllm-backend
    restart: unless-stopped
    ports:
      - "${PORT:-3001}:3001"
    env_file:
      - .env
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DATABASE_URL: postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-password}@postgres:5432/${DB_NAME:-digitalbookllm}
      PORT: 3001
      NODE_ENV: ${NODE_ENV:-production}
      UPLOAD_DIR: /app/uploads
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - digitalbookllm-network

volumes:
  postgres_data:
    driver: local
  uploads_data:
    driver: local

networks:
  digitalbookllm-network:
    driver: bridge
